services:
  - type: web
    name: scheduler-api
    runtime: node
    rootDir: .
    plan: free
    buildCommand: npm install && npm run build -w packages/shared && npm run build -w apps/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: WEB_ORIGIN
        sync: false
      - key: WEB_BASE_URL
        sync: false
      - key: APP_BASE_URL
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
